[project]
name = "shpe-research"
version = "0.1.0"
description = "SHPE Capital research system: market data, features, labels, models and evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "httpx>=0.27",
    "exchange-calendars>=4.5",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Heavier libraries for model tasks (M1-M3). Not needed for the data track or the hello model.
ml = [
    "lightgbm>=4.3",
    "onnx>=1.16",
    "skl2onnx>=1.17",
    "onnxruntime>=1.18",
    "mlflow>=2.14",
]
nn = ["torch>=2.3"]

[project.scripts]
shpe = "shpe_research.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "import-linter>=2",
    "psutil>=7.2.2",
    "numba>=0.68.1",
]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.25"]
workshop = ["jupytext>=1.16", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shpe_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pyarrow's pandas conversion still calls Series.values on tz-aware columns (pandas 3.1 deprecation).
filterwarnings = ["ignore:Series.values returning an ndarray that drops timezone:DeprecationWarning",
                  "ignore:Series.values returning an ndarray that drops timezone"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.importlinter]
root_package = "shpe_research"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["shpe_research"]
layers = [
    "cli",
    "experiments | (scaffold)",
    "calibration",
    "pipeline | deploy | testing",
    "strategies | portfolio | analysis",
    "evaluation | models | validation | events | labels",
    "features | transforms | trade",
    "data",
    "contracts | config",
]
# Known upward imports that already exist as function-local imports in code owned by other packets.
# Each entry is debt: remove it when its owner fixes the import (see the C1l report).
ignore_imports = [
    "shpe_research.contracts.model -> shpe_research.models",
    "shpe_research.contracts.model -> shpe_research.config",
    "shpe_research.pipeline.stages -> shpe_research.experiments.sources",
]

[[tool.importlinter.contracts]]
name = "Trade layer does not import events"
type = "forbidden"
source_modules = ["shpe_research.trade"]
forbidden_modules = ["shpe_research.events"]
