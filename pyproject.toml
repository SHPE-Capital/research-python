[project]
name = "shpe-research"
version = "0.1.0"
description = "SHPE Capital research system: market data, features, labels, models and evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "httpx>=0.27",
    "exchange-calendars>=4.5",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavier libraries for model tasks (M1-M3). Not needed for the data track or the hello model.
ml = [
    "lightgbm>=4.3",
    "onnx>=1.16",
    "skl2onnx>=1.17",
    "onnxruntime>=1.18",
    "mlflow>=2.14",
]
nn = ["torch>=2.3"]

[project.scripts]
shpe = "shpe_research.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shpe_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pyarrow's pandas conversion still calls Series.values on tz-aware columns (pandas 3.1 deprecation).
filterwarnings = ["ignore:Series.values returning an ndarray that drops timezone:DeprecationWarning",
                  "ignore:Series.values returning an ndarray that drops timezone"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
