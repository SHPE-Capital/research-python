# 0-G momentum protocol (stream D slice). Every field at its default.
frozen: false

# weights: read by the weights task (importance weights, ESS solver)
weights:
  uniform_mix: 0.2
  ess_target_fraction: 0.6
  ess_tolerance: 0.01
  solver_bracket: [0.001, 10000.0]
  solver_max_iter: 100
  iqr_floor: 1.0e-12
  descriptor_lookback: 20

# score: read by the score task (objective J)
score:
  downside_coeff: 0.5

# search: read by the search task (budget, seeds, proposals, strategies)
search:
  budget: 2048
  seeds: [1, 2, 3]
  initial_samples: 256
  population: 64
  population_max_subset_share: 0.25
  proposals_per_round: 1024
  mutation_share: 0.75
  recombination_share: 0.5
  max_proposal_attempts_factor: 20
  evals_per_round: 64
  evals_split: [32, 16, 16]
  surrogate_min_results: 128
  finalists_per_seed: 12
  reference_equity: 100000.0
  strategies:
    - id: breakout
      base: breakout
      budget: null
      seeds: null
      account_overrides: {}

# surrogate: read by the search task (gradient-boosted ensemble)
surrogate:
  n_models: 5
  max_iter: 200
  learning_rate: 0.05
  max_leaf_nodes: 15
  min_samples_leaf: 20
  l2_regularization: 1.0

# validation: read by the validation task
validation:
  sessions: 63

# acceptance: provisional floors, read by the finalist selection task
acceptance:
  search_min_trades: 100
  search_min_sessions: 50
  validation_min_trades: 30
  validation_min_sessions: 20
  validation_min_j: 0.0
  max_drawdown: 0.1
  max_single_stock_share: 0.3
  max_finalists: 36
  selection_bps: 10.0
  report_bps: 20.0

# cache: read by the cache task
cache:
  path: null
  granularity: chunk
  warmup_sessions: 20
  busy_timeout_s: 30.0

# compute: read by the search and cache tasks
compute:
  workers: 1
  threads_per_worker: 1
  kernel: fast
  scratch_dir: null
  max_wall_hours: 36.0

# walkforward: read by the walk-forward task (refuses to run while reserved_start is null)
walkforward:
  reserved_start: null
  starting_cash: 100000.0
  policies: [uniform, recency, similarity]
